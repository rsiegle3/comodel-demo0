sql: "SELECT q.*, CASE WHEN q.grid_voltage_v IS NULL THEN 'Missing' ELSE 'Available' END AS grid_voltage_v_availability, CASE WHEN q.grid_frequency_hz IS NULL THEN 'Missing' ELSE 'Available' END AS grid_frequency_hz_availability, CASE WHEN q.power_quality_idx IS NULL THEN 'Missing' ELSE 'Available' END AS power_quality_idx_availability, CASE WHEN q.reactive_power_var IS NULL THEN 'Missing' ELSE 'Available' END AS reactive_power_var_availability, CASE WHEN q.harmonic_distortion_pct IS NULL THEN 'Missing' ELSE 'Available' END AS harmonic_distortion_pct_availability, CASE WHEN q.power_now_w IS NULL THEN 'Missing' ELSE 'Available' END AS power_now_w_availability, CASE WHEN q.power_loss_w IS NULL THEN 'Missing' ELSE 'Available' END AS power_loss_w_availability, CASE WHEN q.power_factor IS NULL THEN 'Missing' ELSE 'Available' END AS power_factor_availability, CASE WHEN q.inverter_temp_c IS NULL THEN 'Missing' ELSE 'Available' END AS inverter_temp_c_availability, CASE WHEN q.inverter_eff_pct IS NULL THEN 'Missing' ELSE 'Available' END AS inverter_eff_pct_availability, CASE WHEN q.imp_now_a IS NULL THEN 'Missing' ELSE 'Available' END AS imp_now_a_availability, CASE WHEN q.isc_now_a IS NULL THEN 'Missing' ELSE 'Available' END AS isc_now_a_availability, CASE WHEN q.vmp_now_v IS NULL THEN 'Missing' ELSE 'Available' END AS vmp_now_v_availability, CASE WHEN q.voc_now_v IS NULL THEN 'Missing' ELSE 'Available' END AS voc_now_v_availability, CASE WHEN q.imp_initial_a IS NULL THEN 'Missing' ELSE 'Available' END AS imp_initial_a_availability, CASE WHEN q.isc_initial_a IS NULL THEN 'Missing' ELSE 'Available' END AS isc_initial_a_availability, CASE WHEN q.shunt_res_ohm IS NULL THEN 'Missing' ELSE 'Available' END AS shunt_res_ohm_availability, CASE WHEN q.vmp_initial_v IS NULL THEN 'Missing' ELSE 'Available' END AS vmp_initial_v_availability, CASE WHEN q.voc_initial_v IS NULL THEN 'Missing' ELSE 'Available' END AS voc_initial_v_availability, CASE WHEN q.series_res_ohm IS NULL THEN 'Missing' ELSE 'Available' END AS series_res_ohm_availability, CASE WHEN q.fill_factor_now IS NULL THEN 'Missing' ELSE 'Available' END AS fill_factor_now_availability, CASE WHEN q.fill_factor_initial IS NULL THEN 'Missing' ELSE 'Available' END AS fill_factor_initial_availability, CASE WHEN q.eff_loss_pct IS NULL THEN 'Missing' ELSE 'Available' END AS eff_loss_pct_availability, CASE WHEN q.soil_loss_pct IS NULL THEN 'Missing' ELSE 'Available' END AS soil_loss_pct_availability, CASE WHEN q.instant_eff_pct IS NULL THEN 'Missing' ELSE 'Available' END AS instant_eff_pct_availability, CASE WHEN q.spectral_mismatch IS NULL THEN 'Missing' ELSE 'Available' END AS spectral_mismatch_availability, CASE WHEN q.cumulative_deg_pct IS NULL THEN 'Missing' ELSE 'Available' END AS cumulative_deg_pct_availability, CASE WHEN q.availability_pct IS NULL THEN 'Missing' ELSE 'Available' END AS availability_pct_availability, CASE WHEN q.energy_yield_kwh IS NULL THEN 'Missing' ELSE 'Available' END AS energy_yield_kwh_availability, CASE WHEN q.performance_ratio IS NULL THEN 'Missing' ELSE 'Available' END AS performance_ratio_availability, CASE WHEN q.capacity_factor_pct IS NULL THEN 'Missing' ELSE 'Available' END AS capacity_factor_pct_availability, CASE WHEN q.specific_yield_kwh_kw IS NULL THEN 'Missing' ELSE 'Available' END AS specific_yield_kwh_kw_availability, CASE WHEN q.dhi_w_m2 IS NULL THEN 'Missing' ELSE 'Available' END AS dhi_w_m2_availability, CASE WHEN q.dni_w_m2 IS NULL THEN 'Missing' ELSE 'Available' END AS dni_w_m2_availability, CASE WHEN q.ghi_w_m2 IS NULL THEN 'Missing' ELSE 'Available' END AS ghi_w_m2_availability, CASE WHEN q.poa_irr_w_m2 IS NULL THEN 'Missing' ELSE 'Available' END AS poa_irr_w_m2_availability, CASE WHEN q.uv_index IS NULL THEN 'Missing' ELSE 'Available' END AS uv_index_availability, CASE WHEN q.cloud_cover_pct IS NULL THEN 'Missing' ELSE 'Available' END AS cloud_cover_pct_availability, CASE WHEN q.air_pressure_hpa IS NULL THEN 'Missing' ELSE 'Available' END AS air_pressure_hpa_availability, CASE WHEN q.dust_density_kg_m3 IS NULL THEN 'Missing' ELSE 'Available' END AS dust_density_kg_m3_availability, CASE WHEN q.relative_humidity_pct IS NULL THEN 'Missing' ELSE 'Available' END AS relative_humidity_pct_availability, CASE WHEN q.cell_temp_c IS NULL THEN 'Missing' ELSE 'Available' END AS cell_temp_c_availability, CASE WHEN q.ambient_temp_c IS NULL THEN 'Missing' ELSE 'Available' END AS ambient_temp_c_availability, CASE WHEN q.rain_mm IS NULL THEN 'Missing' ELSE 'Available' END AS rain_mm_availability, CASE WHEN q.wind_dir_deg IS NULL THEN 'Missing' ELSE 'Available' END AS wind_dir_deg_availability, CASE WHEN q.snow_cover_pct IS NULL THEN 'Missing' ELSE 'Available' END AS snow_cover_pct_availability, CASE WHEN q.wind_speed_m_s IS NULL THEN 'Missing' ELSE 'Available' END AS wind_speed_m_s_availability, CASE WHEN q.tracker_angle_deg IS NULL THEN 'Missing' ELSE 'Available' END AS tracker_angle_deg_availability, CASE WHEN q.hotspot_count IS NULL THEN 'Missing' ELSE 'Available' END AS hotspot_count_availability, CASE WHEN q.microcrack_count IS NULL THEN 'Missing' ELSE 'Available' END AS microcrack_count_availability, CASE WHEN q.cleaning_cycle_days IS NULL THEN 'Missing' ELSE 'Available' END AS cleaning_cycle_days_availability, CASE WHEN q.mtbfh IS NULL THEN 'Missing' ELSE 'Available' END AS mtbfh_availability, CASE WHEN q.mttrh IS NULL THEN 'Missing' ELSE 'Available' END AS mttrh_availability, CASE WHEN q.maintcost IS NULL THEN 'Missing' ELSE 'Available' END AS maintcost_availability, CASE WHEN q.cleancost IS NULL THEN 'Missing' ELSE 'Available' END AS cleancost_availability, CASE WHEN q.replcost IS NULL THEN 'Missing' ELSE 'Available' END AS replcost_availability, CASE WHEN q.revenue_loss IS NULL THEN 'Missing' ELSE 'Available' END AS revenue_loss_availability, CASE WHEN q.alert_events IS NULL THEN 'Missing' ELSE 'Available' END AS alert_events_availability FROM (SELECT r.snapkey,\nr.sitetie,\nr.snapts,\nr.snapts::date AS snapshot_