unique_name: "Solar Panel Specifications"
object_type: "dataset"
label: "Solar Panel Specifications"
description: "Solar Panel Specifications source rows for solar operational analysis."
connection_id: "Solar PostgreSQL"
columns:
  -
    name: "modkey"
    data_type: "string"
  -
    name: "makertag"
    data_type: "string"
  -
    name: "pnlkind"
    data_type: "string"
  -
    name: "rated_w"
    data_type: "double"
  -
    name: "effpct"
    data_type: "double"
  -
    name: "degyrrate"
    data_type: "double"
  -
    name: "tempcoeff"
    data_type: "double"
  -
    name: "nomoptempc"
    data_type: "string"
  -
    name: "nominal_temperature_c"
    data_type: "double"
sql: "SELECT p.*, substring(replace(p.nomoptempc, ',', '') from '-?[0-9]+\\.?[0-9]*')::double precision AS nominal_temperature_c FROM public.panel_models p"
