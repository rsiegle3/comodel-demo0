unique_name: "Solar Calendar Dates"
object_type: "dataset"
label: "Solar Calendar Dates"
description: "Solar Calendar Dates source rows for solar operational analysis."
connection_id: "Solar PostgreSQL"
columns:
  -
    name: "calendar_date"
    data_type: "date"
  -
    name: "calendar_year"
    data_type: "int"
  -
    name: "calendar_quarter"
    data_type: "int"
  -
    name: "calendar_month"
    data_type: "int"
sql: "SELECT d.calendar_date, EXTRACT(YEAR FROM d.calendar_date)::int AS calendar_year, EXTRACT(QUARTER FROM d.calendar_date)::int AS calendar_quarter, EXTRACT(MONTH FROM d.calendar_date)::int AS calendar_month FROM (SELECT DISTINCT snapts::date AS calendar_date FROM public.plant_record WHERE snapts IS NOT NULL UNION SELECT inspectdt FROM public.inspection WHERE inspectdt IS NOT NULL) d"
