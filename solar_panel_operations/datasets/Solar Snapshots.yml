unique_name: "Solar Snapshots"
object_type: "dataset"
label: "Solar Snapshots"
description: "One row per plant snapshot with optional one-to-one detail records; JSON measurements are extracted and text numbers are safely parsed."
connection_id: "Solar Postgres"
sql: "SELECT s.*,\n  CASE WHEN power_now_w IS NOT NULL AND power_loss_w IS NOT NULL THEN 1 ELSE 0 END AS power_complete,\n  CASE WHEN power_now_w IS NOT NULL AND power_loss_w IS NOT NULL THEN 'Complete' ELSE 'Incomplete' END AS power_coverage,\n  CASE WHEN power_now_w IS NOT NULL AND power_loss_w IS NOT NULL THEN power_now_w END AS paired_power_now_w,\n  CASE WHEN power_now_w IS NOT NULL AND power_loss_w IS NOT NULL THEN power_loss_w END AS paired_power_loss_w,\n  CASE WHEN maintcost IS NOT NULL AND cleancost IS NOT NULL AND replcost IS NOT NULL THEN 1 ELSE 0 END AS cost_complete,\n  CASE WHEN maintcost IS NOT NULL AND cleancost IS NOT NULL AND replcost IS NOT NULL THEN 'Complete' ELSE 'Incomplete' END AS cost_coverage,\n  CASE WHEN maintcost IS NOT NULL AND cleancost IS NOT NULL AND replcost IS NOT NULL THEN maintcost END AS paired_maintcost,\n  CASE WHEN maintcost IS NOT NULL AND cleancost IS NOT NULL AND replcost IS NOT NULL THEN cleancost END AS paired_cleancost,\n  CASE WHEN maintcost IS NOT NULL AND cleancost IS NOT NULL AND replcost IS NOT NULL THEN replcost END AS paired_replcost\nFROM (\nSELECT\n  r.snapkey,\n  r.sitetie,\n  r.snapts,\n  r.snapts::date AS snapshot_date,\n  a.snapalrt,\n  a.alrtstate,\n  a.alrtcnt,\n  a.maintprio,\n  a.replprio,\n  o.snapops,\n  o.mtbfh,\n  o.mttrh,\n  o.maintcost,\n  o.cleancost,\n  o.replcost,\n  o.revloss,\n  o.optpot,\n  substring(replace(a.alrtcnt, ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS alert_events,\n  substring(replace(o.revloss, ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS revenue_loss,\n  e.snaplink,\n  e.elec_perf_snapshot::text AS elec_perf_snapshot,\n  substring(replace(e.elec_perf_snapshot #>> '{grid,grid_voltage_v}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS grid_voltage_v,\n  substring(replace(e.elec_perf_snapshot #>> '{grid,grid_frequency_hz}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS grid_frequency_hz,\n  substring(replace(e.elec_perf_snapshot #>> '{grid,power_quality_idx}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS power_quality_idx,\n  substring(replace(e.elec_perf_snapshot #>> '{grid,reactive_power_var}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS reactive_power_var,\n  substring(replace(e.elec_perf_snapshot #>> '{grid,harmonic_distortion_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS harmonic_distortion_pct,\n  substring(replace(e.elec_perf_snapshot #>> '{power,power_now_w}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS power_now_w,\n  substring(replace(e.elec_perf_snapshot #>> '{power,power_loss_w}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS power_loss_w,\n  substring(replace(e.elec_perf_snapshot #>> '{inverter,power_factor}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS power_factor,\n  substring(replace(e.elec_perf_snapshot #>> '{inverter,inverter_temp_c}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS inverter_temp_c,\n  substring(replace(e.elec_perf_snapshot #>> '{inverter,inverter_eff_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS inverter_eff_pct,\n  substring(replace(e.elec_perf_snapshot #>> '{iv_curve,imp_now_a}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS imp_now_a,\n  substring(replace(e.elec_perf_snapshot #>> '{iv_curve,isc_now_a}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS isc_now_a,\n  substring(replace(e.elec_perf_snapshot #>> '{iv_curve,vmp_now_v}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS vmp_now_v,\n  substring(replace(e.elec_perf_snapshot #>> '{iv_curve,voc_now_v}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS voc_now_v,\n  substring(replace(e.elec_perf_snapshot #>> '{iv_curve,imp_initial_a}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS imp_initial_a,\n  substring(replace(e.elec_perf_snapshot #>> '{iv_curve,isc_initial_a}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS isc_initial_a,\n  substring(replace(e.elec_perf_snapshot #>> '{iv_curve,shunt_res_ohm}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS shunt_res_ohm,\n  substring(replace(e.elec_perf_snapshot #>> '{iv_curve,vmp_initial_v}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS vmp_initial_v,\n  substring(replace(e.elec_perf_snapshot #>> '{iv_curve,voc_initial_v}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS voc_initial_v,\n  substring(replace(e.elec_perf_snapshot #>> '{iv_curve,series_res_ohm}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS series_res_ohm,\n  substring(replace(e.elec_perf_snapshot #>> '{iv_curve,fill_factor_now}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS fill_factor_now,\n  substring(replace(e.elec_perf_snapshot #>> '{iv_curve,fill_factor_initial}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS fill_factor_initial,\n  substring(replace(e.elec_perf_snapshot #>> '{efficiency,eff_loss_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS eff_loss_pct,\n  substring(replace(e.elec_perf_snapshot #>> '{efficiency,soil_loss_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS soil_loss_pct,\n  substring(replace(e.elec_perf_snapshot #>> '{efficiency,instant_eff_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS instant_eff_pct,\n  substring(replace(e.elec_perf_snapshot #>> '{efficiency,spectral_mismatch}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS spectral_mismatch,\n  substring(replace(e.elec_perf_snapshot #>> '{efficiency,cumulative_deg_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS cumulative_deg_pct,\n  substring(replace(e.elec_perf_snapshot #>> '{energy_yield,availability_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS availability_pct,\n  substring(replace(e.elec_perf_snapshot #>> '{energy_yield,energy_yield_kwh}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS energy_yield_kwh,\n  substring(replace(e.elec_perf_snapshot #>> '{energy_yield,performance_ratio}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS performance_ratio,\n  substring(replace(e.elec_perf_snapshot #>> '{energy_yield,capacity_factor_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS capacity_factor_pct,\n  substring(replace(e.elec_perf_snapshot #>> '{energy_yield,specific_yield_kwh_kw}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS specific_yield_kwh_kw,\n  v.snapref,\n  v.env_snapshot::text AS env_snapshot,\n  substring(replace(v.env_snapshot #>> '{irradiance,dhi_w_m2}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS dhi_w_m2,\n  substring(replace(v.env_snapshot #>> '{irradiance,dni_w_m2}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS dni_w_m2,\n  substring(replace(v.env_snapshot #>> '{irradiance,ghi_w_m2}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS ghi_w_m2,\n  substring(replace(v.env_snapshot #>> '{irradiance,poa_irr_w_m2}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS poa_irr_w_m2,\n  substring(replace(v.env_snapshot #>> '{atmospheric,uv_index}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS uv_index,\n  substring(replace(v.env_snapshot #>> '{atmospheric,cloud_cover_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS cloud_cover_pct,\n  substring(replace(v.env_snapshot #>> '{atmospheric,air_pressure_hpa}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS air_pressure_hpa,\n  substring(replace(v.env_snapshot #>> '{atmospheric,dust_density_kg_m3}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS dust_density_kg_m3,\n  substring(replace(v.env_snapshot #>> '{atmospheric,relative_humidity_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS relative_humidity_pct,\n  substring(replace(v.env_snapshot #>> '{temperatures,cell_temp_c}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS cell_temp_c,\n  substring(replace(v.env_snapshot #>> '{temperatures,ambient_temp_c}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS ambient_temp_c,\n  substring(replace(v.env_snapshot #>> '{wind_rain_snow,rain_mm}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS rain_mm,\n  substring(replace(v.env_snapshot #>> '{wind_rain_snow,wind_dir_deg}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS wind_dir_deg,\n  substring(replace(v.env_snapshot #>> '{wind_rain_snow,snow_cover_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS snow_cover_pct,\n  substring(replace(v.env_snapshot #>> '{wind_rain_snow,wind_speed_m_s}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS wind_speed_m_s,\n  m.snapmk,\n  m.mech_health_snapshot::text AS mech_health_snapshot,\n  m.mech_health_snapshot #>> '{tracker,tracker_state}' AS tracker_state,\n  substring(replace(m.mech_health_snapshot #>> '{tracker,tracker_angle_deg}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS tracker_angle_deg,\n  m.mech_health_snapshot #>> '{module_surface,lid_status}' AS lid_status,\n  m.mech_health_snapshot #>> '{module_surface,pid_severity}' AS pid_severity,\n  substring(replace(m.mech_health_snapshot #>> '{module_surface,hotspot_count}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS hotspot_count,\n  m.mech_health_snapshot #>> '{module_surface,glass_condition}' AS glass_condition,\n  m.mech_health_snapshot #>> '{module_surface,busbar_corrosion}' AS busbar_corrosion,\n  substring(replace(m.mech_health_snapshot #>> '{module_surface,microcrack_count}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS microcrack_count,\n  m.mech_health_snapshot #>> '{module_surface,backsheet_condition}' AS backsheet_condition,\n  m.mech_health_snapshot #>> '{module_surface,delamination_status}' AS delamination_status,\n  m.mech_health_snapshot #>> '{module_surface,snail_trail_severity}' AS snail_trail_severity,\n  m.mech_health_snapshot #>> '{module_surface,encapsulant_yellowing}' AS encapsulant_yellowing,\n  m.mech_health_snapshot #>> '{mount_cleaning,last_clean_date}' AS last_clean_date,\n  substring(replace(m.mech_health_snapshot #>> '{mount_cleaning,cleaning_cycle_days}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS cleaning_cycle_days,\n  m.mech_health_snapshot #>> '{mount_cleaning,mount_structure_status}' AS mount_structure_status,\n  m.mech_health_snapshot #>> '{electrical_integrity,cable_condition}' AS cable_condition,\n  m.mech_health_snapshot #>> '{electrical_integrity,grounding_status}' AS grounding_status,\n  m.mech_health_snapshot #>> '{electrical_integrity,bypass_diode_status}' AS bypass_diode_status,\n  m.mech_health_snapshot #>> '{electrical_integrity,connector_condition}' AS connector_condition,\n  m.mech_health_snapshot #>> '{electrical_integrity,junction_box_condition}' AS junction_box_condition\nFROM public.plant_record r\nLEFT JOIN public.alert a ON a.snapalrt = r.snapkey\nLEFT JOIN public.operational_metrics o ON o.snapops = r.snapkey\nLEFT JOIN public.electrical_performance e ON e.snaplink = r.snapkey\nLEFT JOIN public.environmental_conditions v ON v.snapref = r.snapkey\nLEFT JOIN public.mechanical_condition m ON m.snapmk = r.snapkey\n) s"
