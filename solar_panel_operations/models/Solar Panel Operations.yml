unique_name: "Solar Panel Operations"
object_type: "model"
label: "Solar Panel Operations"
description: "Solar panel operating observations by plant, primary panel model and snapshot date, with electrical output, efficiency, degradation, weather, mechanical condition, reported costs and alerts. Independent inspection method records use their own calendar."
dimensions:
  - "Solar Snapshot"
  - "Solar Inspection Method"
relationships:
  -
    unique_name: "Solar Snapshot Plant"
    from:
      dataset: "Solar Snapshots"
      join_columns:
        - "sitetie"
    to:
      dimension: "Solar Plant"
      level: "Solar Plant"
  -
    unique_name: "Solar Snapshot Date"
    from:
      dataset: "Solar Snapshots"
      join_columns:
        - "snapshot_date"
    to:
      dimension: "Snapshot Calendar"
      level: "Snapshot Date"
  -
    unique_name: "Solar Inspection Date"
    from:
      dataset: "Solar Inspections"
      join_columns:
        - "inspectdt"
    to:
      dimension: "Inspection Calendar"
      level: "Inspection Date"
