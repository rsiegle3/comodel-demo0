relationships:
  -
    unique_name: "Snapshot To Plant"
    from:
      dataset: "Solar Snapshots"
      join_columns:
        - "sitetie"
    to:
      dimension: "Solar Plant"
      level: "Solar Plant"
  -
    unique_name: "Snapshot To Calendar"
    from:
      dataset: "Solar Snapshots"
      join_columns:
        - "snapshot_date"
    to:
      dimension: "Solar Snapshot Calendar"
      level: "Snapshot Date"
ai_context:
  -
    source_type: "warehouse"
    source: "bird_solar_panel / solar_panel.public"
    instruction: "Authored solely from warehouse PK/FK metadata and ten-row samples in this clean session. No warehouse comments were present. Eight nonempty tables are used: plant_record, plants, panel_models, electrical_performance, environmental_conditions, mechanical_condition, operational_metrics and alert. Detail tables have snapshot PK/FK keys and are left joined one-to-one. Source timestamp timezone and observation interval are unspecified. No agent memory or reference semantic model was consulted."
  -
    source_type: "other"
    source: "catalog.yml and PROMPT.md"
    instruction: "Scope: general solar plant output, efficiency, degradation, cost and alerts. The model owns the solar_panel_operations directory. Percent readings retain source percentage points. Snapshot measurements use observation averages, not temporal sums. Formula components use matched non-null populations."
  -
    source_type: "warehouse"
    source: "Deliberate exclusions and discovery limitations"
    instruction: "inspection is excluded because it has no plant or snapshot FK or matching join key. plant_panel_model is a many-to-many membership bridge without panel counts or allocation weights; excluded to prevent duplicating observations. Primary model analysis uses plants.modhook only. Raw JSON is retained as dataset text but not exposed as a BI attribute; all nested paths observed in the samples are exposed. No empty tables or as_agg tables were found in public. Global statistics failed with a Redis timeout; no total row-count claims were inferred. Initial schema-qualified sample requests failed because the API also prefixes schema; retrying with separate schema and bare table succeeded."
