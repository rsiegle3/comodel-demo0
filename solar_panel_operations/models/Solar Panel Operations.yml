ai_context:
  -
    source_type: "warehouse"
    source: "bird_solar_panel / solar_panel / public"
    instruction: "Built from live warehouse metadata, PK/FK declarations, samples and physical-table statistics on 2026-10-19. No prior semantic models or agent memory used. Warehouse comments were absent. plant_record is the snapshot grain; alert, electrical_performance, environmental_conditions, mechanical_condition and operational_metrics join by their declared PK/FK with LEFT JOINs. Numeric JSON leaves and formatted numbers are safely parsed; original physical columns are retained."
  -
    source_type: "other"
    source: "Model scope and exclusions"
    instruction: "plants.modhook selects the primary panel model. plant_panel_model is deliberately excluded: additional many-to-many assignments have no quantity, allocation weight or effective date, so snapshot output cannot be attributed to individual assigned models. inspection is modeled as an independent fact keyed by inspectmode; no plant or snapshot relationship is invented. No empty or as_agg_ tables were found among the ten public source tables. System schemas are not business data."
  -
    source_type: "other"
    source: "Aggregation and data quality"
    instruction: "Snapshot numeric values are observation-weighted averages with visible coverage counts and availability classifiers, not sums over time. Reported energy yield has unspecified interval/cumulative semantics and is not exposed as integrated energy production. Reported efficiency and performance ratios are not recomputed without defined input components. Complete service cost calculations use the intersection of all three non-null cost inputs. Costs are reported snapshot amounts with unspecified currency/interval, not transaction spend. Plant capacities and panel specifications are attributes and are never summed per snapshot. Nulls remain missing. Inspection dates and last-clean dates can postdate snapshot timestamps; no causal or event-history linkage is asserted. Calendar datasets contain observed dates only, not a gap-free time series."
