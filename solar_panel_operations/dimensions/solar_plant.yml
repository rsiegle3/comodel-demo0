unique_name: "Solar Plant"
object_type: "dimension"
label: "Solar Plant"
description: "Solar plant site keyed by sitekey with a display name such as Solar Plant West Davidport; identical names remain distinct sites."
type: "standard"
level_attributes:
  -
    unique_name: "Solar Plant"
    label: "Solar Plant"
    description: "Solar plant site keyed by sitekey with a display name such as Solar Plant West Davidport; identical names remain distinct sites."
    dataset: "Solar Plants"
    key_columns:
      - "sitekey"
    name_column: "sitelabel"
    is_unique_key: true
hierarchies:
  -
    unique_name: "Solar Plant Hierarchy"
    label: "Solar Plant Hierarchy"
    description: "Solar plant site keyed by sitekey with a display name such as Solar Plant West Davidport; identical names remain distinct sites."
    filter_empty: "yes"
    folder: "Solar Plant"
    levels:
      -
        unique_name: "Solar Plant"
        secondary_attributes:
          -
            unique_name: "Plant Capacity MW"
            label: "Plant Capacity MW"
            description: "Installed site capacity in megawatts, not per-panel rated watts."
            dataset: "Solar Plants"
            key_columns:
              - "cap_mw"
            name_column: "cap_mw"
          -
            unique_name: "Plant Commissioning Date"
            label: "Plant Commissioning Date"
            description: "Site go-live date, not snapshot or inspection date."
            dataset: "Solar Plants"
            key_columns:
              - "goliveon"
            name_column: "goliveon"
          -
            unique_name: "Plant Tilt Degrees"
            label: "Plant Tilt Degrees"
            description: "Fixed site panel tilt angle in degrees, not the measured tracker angle."
            dataset: "Solar Plants"
            key_columns:
              - "tiltdeg"
            name_column: "tiltdeg"
          -
            unique_name: "Plant Azimuth Degrees"
            label: "Plant Azimuth Degrees"
            description: "Site orientation azimuth in degrees, not wind direction."
            dataset: "Solar Plants"
            key_columns:
              - "azmdeg"
            name_column: "azmdeg"
          -
            unique_name: "Plant Recycling Status"
            label: "Plant Recycling Status"
            description: "Site recycling plan status; examples include Available and In Development."
            dataset: "Solar Plants"
            key_columns:
              - "recyclenote"
            name_column: "recyclenote"
          -
            unique_name: "Plant Documentation Status"
            label: "Plant Documentation Status"
            description: "Site documentation completeness; examples include Missing, Partial and Complete."
            dataset: "Solar Plants"
            key_columns:
              - "docstate"
            name_column: "docstate"
          -
            unique_name: "Plant Warranty Status"
            label: "Plant Warranty Status"
            description: "Site warranty state; examples include Active, Claimed and Expired."
            dataset: "Solar Plants"
            key_columns:
              - "warrstate"
            name_column: "warrstate"
          -
            unique_name: "Plant Warranty Claims"
            label: "Plant Warranty Claims"
            description: "Recorded warranty claim count at site grain, not snapshot alert events."
            dataset: "Solar Plants"
            key_columns:
              - "warrclaims"
            name_column: "warrclaims"
          -
            unique_name: "Plant Insurance Status"
            label: "Plant Insurance Status"
            description: "Site insurance coverage; examples include Covered, Partial and Expired."
            dataset: "Solar Plants"
            key_columns:
              - "insurstate"
            name_column: "insurstate"
          -
            unique_name: "Plant Compliance Status"
            label: "Plant Compliance Status"
            description: "Site compliance state; examples include Compliant, Non-Compliant and Under Review."
            dataset: "Solar Plants"
            key_columns:
              - "complyflag"
            name_column: "complyflag"
          -
            unique_name: "Plant Environmental Risk"
            label: "Plant Environmental Risk"
            description: "Site environmental risk category High, Medium or Low; not weather measurements."
            dataset: "Solar Plants"
            key_columns:
              - "envtag"
            name_column: "envtag"
relationships:
  -
    unique_name: "Solar Plant Primary Panel"
    type: "embedded"
    from:
      hierarchy: "Solar Plant Hierarchy"
      level: "Solar Plant"
      dataset: "Solar Plants"
      join_columns:
        - "modhook"
    to:
      dimension: "Solar Panel Model"
      level: "Solar Panel Model"
