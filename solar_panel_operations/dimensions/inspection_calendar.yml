unique_name: "Inspection Calendar"
object_type: "dimension"
label: "Inspection Calendar"
description: "Inspection date calendar for year, quarter, month and day analysis."
type: "time"
level_attributes:
  -
    unique_name: "Inspection Year"
    label: "Inspection Year"
    description: "Inspection year in the Gregorian calendar; based on inspection record date, not plant observation time."
    dataset: "Solar Calendar Dates"
    key_columns:
      - "calendar_year"
    name_column: "calendar_year"
    time_unit: "year"
  -
    unique_name: "Inspection Quarter"
    label: "Inspection Quarter"
    description: "Inspection quarter in the Gregorian calendar; based on inspection record date, not plant observation time."
    dataset: "Solar Calendar Dates"
    key_columns:
      - "calendar_year"
      - "calendar_quarter"
    name_column: "calendar_quarter"
    time_unit: "quarter"
  -
    unique_name: "Inspection Month"
    label: "Inspection Month"
    description: "Inspection month in the Gregorian calendar; based on inspection record date, not plant observation time."
    dataset: "Solar Calendar Dates"
    key_columns:
      - "calendar_year"
      - "calendar_quarter"
      - "calendar_month"
    name_column: "calendar_month"
    time_unit: "month"
  -
    unique_name: "Inspection Date"
    label: "Inspection Date"
    description: "Inspection day in the Gregorian calendar; based on inspection record date, not plant observation time."
    dataset: "Solar Calendar Dates"
    key_columns:
      - "calendar_date"
    name_column: "calendar_date"
    time_unit: "day"
    is_unique_key: true
hierarchies:
  -
    unique_name: "Inspection Calendar Hierarchy"
    label: "Inspection Calendar Hierarchy"
    description: "Inspection Gregorian year to day drill path."
    filter_empty: "yes"
    folder: "Inspection Calendar"
    levels:
      -
        unique_name: "Inspection Year"
      -
        unique_name: "Inspection Quarter"
      -
        unique_name: "Inspection Month"
      -
        unique_name: "Inspection Date"
