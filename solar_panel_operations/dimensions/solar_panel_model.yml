unique_name: "Solar Panel Model"
object_type: "dimension"
label: "Solar Panel Model"
description: "Primary panel model business code, such as Model-102; selected through plants.modhook."
type: "standard"
level_attributes:
  -
    unique_name: "Solar Panel Model"
    label: "Solar Panel Model"
    description: "Primary panel model business code, such as Model-102; selected through plants.modhook."
    dataset: "Solar Panel Specifications"
    key_columns:
      - "modkey"
    name_column: "modkey"
    is_unique_key: true
hierarchies:
  -
    unique_name: "Solar Panel Model Hierarchy"
    label: "Solar Panel Model Hierarchy"
    description: "Primary panel model business code, such as Model-102; selected through plants.modhook."
    filter_empty: "yes"
    folder: "Solar Panel Model"
    levels:
      -
        unique_name: "Solar Panel Model"
        secondary_attributes:
          -
            unique_name: "Panel Manufacturer"
            label: "Panel Manufacturer"
            description: "Manufacturer of the primary panel model; examples include Longi and Canadian Solar."
            dataset: "Solar Panel Specifications"
            key_columns:
              - "makertag"
            name_column: "makertag"
          -
            unique_name: "Panel Technology"
            label: "Panel Technology"
            description: "Cell technology of the primary panel model; examples include Mono-PERC, HJT and Bifacial."
            dataset: "Solar Panel Specifications"
            key_columns:
              - "pnlkind"
            name_column: "pnlkind"
          -
            unique_name: "Panel Rated Power W"
            label: "Panel Rated Power W"
            description: "Nameplate rated watts per panel model, not observed plant output."
            dataset: "Solar Panel Specifications"
            key_columns:
              - "rated_w"
            name_column: "rated_w"
          -
            unique_name: "Panel Rated Efficiency Percent"
            label: "Panel Rated Efficiency Percent"
            description: "Panel model efficiency specification in percentage points, not observed instantaneous efficiency."
            dataset: "Solar Panel Specifications"
            key_columns:
              - "effpct"
            name_column: "effpct"
          -
            unique_name: "Panel Annual Degradation Percent"
            label: "Panel Annual Degradation Percent"
            description: "Annual degradation rate specification in percentage points, not observed cumulative degradation."
            dataset: "Solar Panel Specifications"
            key_columns:
              - "degyrrate"
            name_column: "degyrrate"
          -
            unique_name: "Panel Temperature Coefficient"
            label: "Panel Temperature Coefficient"
            description: "Panel model temperature coefficient as stored; source has no unit comment."
            dataset: "Solar Panel Specifications"
            key_columns:
              - "tempcoeff"
            name_column: "tempcoeff"
          -
            unique_name: "Panel Nominal Temperature Text"
            label: "Panel Nominal Temperature Text"
            description: "Original nominal operating temperature text including units, such as 45.7 C."
            dataset: "Solar Panel Specifications"
            key_columns:
              - "nomoptempc"
            name_column: "nomoptempc"
          -
            unique_name: "Panel Nominal Temperature C"
            label: "Panel Nominal Temperature C"
            description: "Numeric nominal operating temperature in degrees Celsius, parsed from model specification text."
            dataset: "Solar Panel Specifications"
            key_columns:
              - "nominal_temperature_c"
            name_column: "nominal_temperature_c"
